<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="color-scheme" content="dark"/>
<title>Skull Chaser — Tengkorak Pengejar Kursor</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Creepster&family=Rubik:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
  :root{
    --bg:#07070f;
    --bone:#eae3cf;
    --glow:#a4ff4f;
    --danger:#ff4d4d;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{cursor:none}
  html,body{height:100%}
  body{
    background:radial-gradient(1200px 800px at 50% 40%, #10101c 0%, #07070f 60%, #050509 100%);
    overflow:hidden;
    touch-action:none;
    overscroll-behavior:none;
    user-select:none;
    -webkit-user-select:none;
    font-family:'Rubik',system-ui,sans-serif;
    color:#cfc8b8;
  }
  #world{position:fixed;inset:0}
  #world.shake{animation:shake .32s linear}
  @keyframes shake{
    0%,100%{transform:none}
    20%{transform:translate(-6px,4px)}
    40%{transform:translate(5px,-5px)}
    60%{transform:translate(-4px,-3px)}
    80%{transform:translate(4px,3px)}
  }

  /* kabut latar */
  .fog{position:fixed;border-radius:50%;filter:blur(90px);opacity:.14;pointer-events:none;z-index:0}
  .fog.a{width:46vw;height:46vw;background:#5a3fa0;left:-10vw;top:-8vw;animation:drift 26s ease-in-out infinite alternate}
  .fog.b{width:40vw;height:40vw;background:#1f6f5a;right:-8vw;bottom:-10vw;animation:drift 32s ease-in-out infinite alternate-reverse}
  @keyframes drift{to{transform:translate(9vw,6vh) scale(1.15)}}

  canvas#fx{position:fixed;inset:0;z-index:10;pointer-events:none}

  /* makhluk tengkorak */
  .skull{position:fixed;left:0;top:0;z-index:20;pointer-events:none;will-change:transform;filter:drop-shadow(0 16px 26px rgba(0,0,0,.55))}
  .skull svg{display:block;overflow:visible}
  .horn{fill:#d6cba8;stroke:#3a3226;stroke-opacity:.3;stroke-width:2}
  .bone{fill:url(#boneGrad);stroke:#3a3226;stroke-opacity:.3;stroke-width:2}
  .crack{stroke:#a99e7e;stroke-width:2;fill:none;opacity:.55;stroke-linejoin:round;stroke-linecap:round}
  .maw{fill:#0c0a12}
  .mawGlow{fill:#ff2d4e;opacity:0;filter:blur(6px)}
  .tooth{fill:#f4eedb;stroke:#b3a886;stroke-width:1}
  .jawBone{fill:url(#boneGrad);stroke:#3a3226;stroke-opacity:.3;stroke-width:2}
  .socket{fill:url(#socketGrad)}
  .brow{stroke:#0b0a10;stroke-width:11;stroke-linecap:round;fill:none}
  .nose{fill:#0c0a12}
  .glow{fill:#9dff57}
  .core{fill:#fff;opacity:.95}

  /* vignette */
  #vig{position:fixed;inset:0;z-index:40;pointer-events:none;
    background:radial-gradient(ellipse at 50% 45%, transparent 52%, rgba(4,4,10,.6) 100%)}

  /* UI */
  #title{position:fixed;left:22px;top:18px;z-index:50;pointer-events:none;
    font-family:'Creepster',cursive;font-size:30px;letter-spacing:3px;color:var(--bone);
    text-shadow:0 0 18px rgba(164,255,79,.25);line-height:1}
  #title .sk{color:var(--danger);font-size:24px;vertical-align:2px}
  #title small{display:block;font-family:'Rubik',sans-serif;font-size:10px;letter-spacing:4px;color:#7d7666;margin-top:7px;text-transform:uppercase}
  #counter{position:fixed;right:22px;top:22px;z-index:50;pointer-events:none;
    font-weight:600;letter-spacing:2px;font-size:12px;color:#9b937f;text-transform:uppercase}
  #counter b{color:#c8ff6a;font-size:19px;margin-left:6px;text-shadow:0 0 10px rgba(164,255,79,.5)}
  #hint{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:50;pointer-events:none;
    font-size:12px;letter-spacing:3px;color:#7d7666;text-transform:uppercase;transition:opacity 1.2s;white-space:nowrap}
  #hint.hide{opacity:0}
  #tip{position:fixed;left:22px;bottom:20px;z-index:50;pointer-events:none;
    font-size:10px;letter-spacing:3px;color:#5d574a;text-transform:uppercase}

  /* efek gigitan */
  .ring{position:fixed;width:26px;height:26px;margin:-13px 0 0 -13px;border:2.5px solid var(--glow);
    border-radius:50%;pointer-events:none;z-index:55;animation:ringPop .5s ease-out forwards}
  @keyframes ringPop{from{transform:scale(.4);opacity:.95}to{transform:scale(3.4);opacity:0}}
  .pop{position:fixed;z-index:56;pointer-events:none;font-family:'Creepster',cursive;font-size:24px;
    letter-spacing:1px;color:#c8ff6a;text-shadow:0 0 12px rgba(164,255,79,.8);animation:popUp .8s ease-out forwards}
  @keyframes popUp{from{transform:translate(-50%,0) scale(.6);opacity:1}to{transform:translate(-50%,-56px) scale(1.25);opacity:0}}

  /* kursor kustom */
  #cursorWrap{position:fixed;left:0;top:0;z-index:60;pointer-events:none;will-change:transform}
  .cursor-ring{position:absolute;left:-18px;top:-18px;width:36px;height:36px;border-radius:50%;
    border:1.5px solid rgba(164,255,79,.8);
    box-shadow:0 0 14px rgba(164,255,79,.3), inset 0 0 8px rgba(164,255,79,.2);
    transition:border-color .25s,box-shadow .25s}
  .cursor-ring.hunt{border-color:rgba(255,77,77,.9);
    box-shadow:0 0 18px rgba(255,77,77,.4), inset 0 0 10px rgba(255,77,77,.3)}
  .cursor-ring.flash{animation:cflash .35s ease-out}
  @keyframes cflash{0%{transform:scale(1)}35%{transform:scale(1.8)}100%{transform:scale(1)}}
  .cursor-dot{position:absolute;left:-3.5px;top:-3.5px;width:7px;height:7px;border-radius:50%;
    background:#eaffcf;box-shadow:0 0 10px var(--glow)}

  @media (pointer:coarse){
    html{cursor:auto}
    #cursorWrap{display:none}
    #hint{display:none}
  }
</style>
</head>
<body>
<div id="world">
  <div class="fog a"></div><div class="fog b"></div>
  <canvas id="fx"></canvas>

  <!-- gradien bersama untuk semua tengkorak -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <radialGradient id="boneGrad" cx="50%" cy="32%" r="80%">
        <stop offset="0%" stop-color="#f6f0dc"/>
        <stop offset="55%" stop-color="#e7dec6"/>
        <stop offset="100%" stop-color="#b3a886"/>
      </radialGradient>
      <radialGradient id="socketGrad" cx="50%" cy="45%" r="60%">
        <stop offset="0%" stop-color="#000000"/>
        <stop offset="75%" stop-color="#0d0b14"/>
        <stop offset="100%" stop-color="#251f33"/>
      </radialGradient>
    </defs>
  </svg>

  <div id="title"><span class="sk">☠</span> SKULL CHASER<small>sang tengkorak pengejar kursor</small></div>
  <div id="counter">gigitan<b id="bites">0</b></div>
  <div id="hint">gerakkan kursor — ia akan mengejar &amp; menggigit</div>
  <div id="tip">klik untuk menerkam</div>
  <div id="vig"></div>
</div>

<div id="cursorWrap"><div class="cursor-ring"></div><div class="cursor-dot"></div></div>

<script>
(function(){
'use strict';

/* ---------- elemen & kanvas ---------- */
const world      = document.getElementById('world');
const cvs        = document.getElementById('fx');
const ctx        = cvs.getContext('2d');
const cursorWrap = document.getElementById('cursorWrap');
const ringEl     = cursorWrap.querySelector('.cursor-ring');
const bitesEl    = document.getElementById('bites');
const hintEl     = document.getElementById('hint');

let W = innerWidth, H = innerHeight;
const DPR = Math.min(window.devicePixelRatio || 1, 2);
function resize(){
  W = innerWidth; H = innerHeight;
  cvs.width = W * DPR; cvs.height = H * DPR;
  cvs.style.width = W + 'px'; cvs.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

/* ---------- input ---------- */
const mouse = { x: W/2, y: H*0.42, active:false };
function setMouse(x, y){
  mouse.x = x; mouse.y = y;
  if(!mouse.active){ mouse.active = true; hintEl.classList.add('hide'); }
}
addEventListener('pointermove', e => setMouse(e.clientX, e.clientY), { passive:true });
addEventListener('pointerdown', e => {
  setMouse(e.clientX, e.clientY);
  if(main){ // menerkam!
    main.vx += (mouse.x - main.x) * 0.10;
    main.vy += (mouse.y - main.y) * 0.10;
  }
});

/* ---------- util ---------- */
const clamp01 = v => v < 0 ? 0 : v > 1 ? 1 : v;
function eyeColor(t){ // hijau normal -> merah saat berburu
  const r = Math.round(157 + 98*t), g = Math.round(255 - 186*t), b = Math.round(87 - 18*t);
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

/* ---------- template SVG tengkorak (tanduk = nuansa "hewan") ---------- */
const SKULL_MARK =
`<svg viewBox="0 0 220 210" xmlns="http://www.w3.org/2000/svg">
  <path class="horn" d="M63,46 C40,36 27,20 28,3 C47,10 64,24 72,41 Z"/>
  <path class="horn" d="M157,46 C180,36 193,20 192,3 C173,10 156,24 148,41 Z"/>
  <path class="bone" d="M33,103 C33,47 68,17 110,17 C152,17 187,47 187,103 C187,131 173,147 151,155 L69,155 C47,147 33,131 33,103 Z"/>
  <path class="crack" d="M97,19 L105,33 L98,44 L106,55"/>
  <rect class="maw" x="84" y="147" width="59" height="34" rx="8"/>
  <ellipse class="mawGlow" cx="114" cy="170" rx="24" ry="10"/>
  <rect class="tooth" x="84"  y="149" width="13" height="15" rx="3"/>
  <rect class="tooth" x="99"  y="150" width="13" height="15" rx="3"/>
  <rect class="tooth" x="115" y="150" width="13" height="15" rx="3"/>
  <rect class="tooth" x="130" y="149" width="13" height="15" rx="3"/>
  <g class="jaw"><rect class="jawBone" x="76" y="158" width="68" height="25" rx="11"/></g>
  <ellipse class="socket" cx="77"  cy="99" rx="25" ry="28" transform="rotate(-8 77 99)"/>
  <ellipse class="socket" cx="143" cy="99" rx="25" ry="28" transform="rotate(8 143 99)"/>
  <circle class="glow gL" cx="77"  cy="100" r="9.5"/>
  <circle class="core cL" cx="77"  cy="100" r="3.2"/>
  <circle class="glow gR" cx="143" cy="100" r="9.5"/>
  <circle class="core cR" cx="143" cy="100" r="3.2"/>
  <path class="brow" d="M52,78 L100,95"/>
  <path class="brow" d="M168,78 L120,95"/>
  <path class="nose" d="M110,122 L101,143 Q110,150 119,143 Z"/>
</svg>`;

/* ---------- kelas tengkorak ---------- */
class Skull{
  constructor(o){
    this.scale   = o.scale;
    this.canBite = !!o.canBite;
    this.phase   = o.phase || 0;
    this.trailIdx= o.trailIdx || 0;
    this.k       = o.k;
    this.damp    = o.damp;
    this.x = W/2; this.y = H/2; this.vx = 0; this.vy = 0;
    this.tilt = 0; this.jaw = 0; this.biteCd = 0; this.biteAnim = 0; this.emit = 0;

    const d = document.createElement('div');
    d.className = 'skull';
    d.style.opacity = (o.opacity != null ? o.opacity : 1);
    d.innerHTML = SKULL_MARK;
    const svg = d.querySelector('svg');
    svg.style.width  = 220*this.scale + 'px';
    svg.style.height = 210*this.scale + 'px';
    this.el = d; world.appendChild(d);

    this.gL = d.querySelector('.gL'); this.gR = d.querySelector('.gR');
    this.cL = d.querySelector('.cL'); this.cR = d.querySelector('.cR');
    this.jawEl = d.querySelector('.jaw');
    this.maw   = d.querySelector('.mawGlow');
    this.glows = [this.gL, this.gR];
    this.cores = [this.cL, this.cR];
  }

  update(dt, t, target, look){
    const n = Math.min(Math.max(dt*60, 0.4), 2);

    /* fisika pegas: mengejar target */
    this.vx += (target.x - this.x) * this.k * n;
    this.vy += (target.y - this.y) * this.k * n;
    const f = Math.pow(this.damp, n);
    this.vx *= f; this.vy *= f;
    this.x += this.vx * n; this.y += this.vy * n;

    const dm = Math.hypot(look.x - this.x, look.y - this.y);

    /* miring mengikuti arah gerak */
    const tt = Math.max(-20, Math.min(20, this.vx * 1.3));
    this.tilt += (tt - this.tilt) * Math.min(1, 0.12*n);

    /* rahang: makin dekat makin lapar, dekat sekali = menggompol */
    const jawT = dm < 95
      ? 0.55 + 0.45 * Math.abs(Math.sin(t*13 + this.phase))
      : clamp01((320 - dm) / 230);
    this.jaw += (jawT - this.jaw) * Math.min(1, 0.28*n);

    /* gigitan */
    if(this.canBite){
      this.biteCd -= dt;
      if(this.biteAnim > 0) this.biteAnim = Math.max(0, this.biteAnim - dt*2.6);
      if(mouse.active && dm < 80 && this.biteCd <= 0) bite(this);
    }

    /* asap kalau ngebut */
    const sp = Math.hypot(this.vx, this.vy);
    if(sp > 2){
      this.emit += dt * sp * 3;
      while(this.emit > 1){
        this.emit -= 1;
        spawnSmoke(this.x - this.vx*6 + (Math.random()-.5)*16,
                   this.y - this.vy*6 + (Math.random()-.5)*16);
      }
    } else this.emit = 0;

    /* render posisi + napas + ayunan diam */
    const bob = sp < 0.7 ? Math.sin(t*2.1 + this.phase) * 5 : 0;
    const br  = 1 + Math.sin(t*2.6 + this.phase)*0.015
                  + (this.biteAnim > 0 ? Math.sin(this.biteAnim*Math.PI)*0.09 : 0);
    const w = 220*this.scale, h = 210*this.scale;
    this.el.style.transform =
      'translate3d(' + (this.x - w/2) + 'px,' + (this.y - h/2 + bob) + 'px,0) ' +
      'rotate(' + this.tilt.toFixed(2) + 'deg) scale(' + br.toFixed(3) + ')';

    /* bola mata selalu melihat kursor */
    let lx = look.x - this.x, ly = look.y - this.y;
    const L = Math.hypot(lx, ly) || 1;
    lx = lx/L*8; ly = ly/L*8;
    this.gL.setAttribute('cx', 77+lx);  this.gL.setAttribute('cy', 100+ly);
    this.gR.setAttribute('cx', 143+lx); this.gR.setAttribute('cy', 100+ly);
    this.cL.setAttribute('cx', 77+lx*1.12);  this.cL.setAttribute('cy', 100+ly*1.12);
    this.cR.setAttribute('cx', 143+lx*1.12); this.cR.setAttribute('cy', 100+ly*1.12);

    /* mode berburu: mata memerah & berdenyut */
    const hunt = clamp01((260 - dm) / 150);
    const col  = eyeColor(hunt);
    const rr   = (9.5 + hunt*2*Math.abs(Math.sin(t*11 + this.phase))).toFixed(2);
    for(const g of this.glows){
      g.setAttribute('r', rr);
      g.style.fill = col;
      g.style.filter = 'drop-shadow(0 0 7px ' + col + ')';
    }
    this.maw.style.opacity = (this.jaw * 0.55 * (0.35 + hunt*0.65)).toFixed(3);
    this.jawEl.setAttribute('transform', 'translate(0 ' + (this.jaw*24).toFixed(2) + ')');
  }
}

/* ---------- efek gigitan ---------- */
let bites = 0;
const POPS = ['NYAM!','KRAUK!','GEROGYOK!','NGK!'];
function bite(sk){
  sk.biteCd = 0.85; sk.biteAnim = 1; sk.jaw = 0.06;
  bites++; bitesEl.textContent = bites;
  burst(mouse.x, mouse.y);
  ring(mouse.x, mouse.y);
  popText(mouse.x, mouse.y);
  ringEl.classList.remove('flash'); void ringEl.offsetWidth; ringEl.classList.add('flash');
  world.classList.remove('shake');  void world.offsetWidth;  world.classList.add('shake');
}
function ring(x, y){
  const r = document.createElement('div'); r.className = 'ring';
  r.style.left = x+'px'; r.style.top = y+'px';
  document.body.appendChild(r);
  r.addEventListener('animationend', () => r.remove());
}
function popText(x, y){
  const p = document.createElement('div'); p.className = 'pop';
  p.textContent = POPS[(Math.random()*POPS.length)|0];
  p.style.left = (x + (Math.random()-.5)*30) + 'px';
  p.style.top  = (y - 30) + 'px';
  document.body.appendChild(p);
  p.addEventListener('animationend', () => p.remove());
}

/* ---------- partikel (debu, asap, percikan) ---------- */
const dust = [], smoke = [], sparks = [];
for(let i = 0; i < 70; i++){
  dust.push({ x:Math.random()*W, y:Math.random()*H, r:.6+Math.random()*1.5,
              s:.06+Math.random()*.28, a:.05+Math.random()*.2, ph:Math.random()*6.28 });
}
function spawnSmoke(x, y){
  if(smoke.length > 150) smoke.shift();
  smoke.push({ x, y, vx:(Math.random()-.5)*.5, vy:-.15-Math.random()*.4,
               r:5+Math.random()*6, life:1, dec:.8+Math.random()*.7 });
}
function burst(x, y){
  for(let i = 0; i < 26; i++){
    const a = Math.random()*6.283, v = 1.5 + Math.random()*5.5;
    if(sparks.length > 300) sparks.shift();
    sparks.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v-1.2,
                  life:1, dec:1.3+Math.random()*1.5, r:1+Math.random()*2.4, w:Math.random()<.5 });
  }
}
function drawFx(dt, t){
  ctx.clearRect(0, 0, W, H);
  ctx.fillStyle = '#cfc8b0';
  for(const p of dust){
    p.y -= p.s; p.x += Math.sin(t*.5 + p.ph)*.07;
    if(p.y < -4){ p.y = H+4; p.x = Math.random()*W; }
    ctx.globalAlpha = p.a;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
  }
  for(let i = smoke.length-1; i >= 0; i--){
    const p = smoke[i]; p.life -= p.dec*dt;
    if(p.life <= 0){ smoke.splice(i,1); continue; }
    p.x += p.vx; p.y += p.vy; p.r += 13*dt;
    ctx.globalAlpha = p.life*.15; ctx.fillStyle = '#9a8fc4';
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
  }
  for(let i = sparks.length-1; i >= 0; i--){
    const p = sparks[i]; p.life -= p.dec*dt;
    if(p.life <= 0){ sparks.splice(i,1); continue; }
    p.vy += .12; p.x += p.vx; p.y += p.vy;
    ctx.globalAlpha = Math.min(1, p.life*1.4);
    ctx.fillStyle = p.w ? '#c8ff6a' : '#ffffff';
    ctx.shadowColor = '#a4ff4f'; ctx.shadowBlur = 8;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
  }
  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
}

/* ---------- inisialisasi: 1 tengkorak utama + 2 anak buah ekor ---------- */
const hist = [];
const main  = new Skull({ scale:.62, canBite:true, k:.022, damp:.88, opacity:1,  phase:0   });
const mini1 = new Skull({ scale:.36, k:.03, damp:.86, opacity:.8, phase:2.1, trailIdx:24 });
const mini2 = new Skull({ scale:.27, k:.03, damp:.85, opacity:.6, phase:4.2, trailIdx:48 });

/* ---------- kursor kustom ---------- */
const cur = { x:mouse.x, y:mouse.y };

/* ---------- loop utama ---------- */
let t = 0, last = performance.now();
function frame(now){
  const dt = Math.min((now - last)/1000, .05) || .016;
  last = now; t += dt;

  main.update(dt, t, mouse, mouse);
  hist.unshift({ x:main.x, y:main.y });
  if(hist.length > 100) hist.pop();
  mini1.update(dt, t, hist[Math.min(hist.length-1, mini1.trailIdx)] || mouse, mouse);
  mini2.update(dt, t, hist[Math.min(hist.length-1, mini2.trailIdx)] || mouse, mouse);

  drawFx(dt, t);

  cur.x += (mouse.x - cur.x) * .5;
  cur.y += (mouse.y - cur.y) * .5;
  cursorWrap.style.transform = 'translate3d(' + cur.x + 'px,' + cur.y + 'px,0)';
  const dm = Math.hypot(mouse.x - main.x, mouse.y - main.y);
  ringEl.classList.toggle('hunt', mouse.active && dm < 200);

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
